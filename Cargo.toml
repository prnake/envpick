[package]
name = "envpick"
version = "0.1.0"
edition = "2024"
description = "Environment variable / profile manager with a TUI and end-to-end encrypted sync"
license = "MIT"

[[bin]]
name = "envpick"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7"

# TUI
ratatui = "0.30"
crossterm = "0.29"

# crypto
aes-gcm = "0.11"
hkdf = "0.13"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
zeroize = { version = "1", features = ["derive"] }

# http
ureq = "3"

# misc
unicode-width = "0.2"
