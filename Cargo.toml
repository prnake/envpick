[package]
name = "envpick"
version = "0.1.0"
edition = "2024"
description = "Environment variable / profile manager with a TUI and end-to-end encrypted sync"
license = "MIT"

[[bin]]
name = "envpick"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7"

# TUI
ratatui = "0.30"
crossterm = "0.29"

# crypto
aes-gcm = "0.11"
hkdf = "0.13"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
zeroize = { version = "1", features = ["derive"] }

# http
#
# `socks-proxy` is not optional in practice. ureq's default feature set reads
# `http_proxy`/`https_proxy` but not `all_proxy`, and a shell with only
# `all_proxy=socks5://…` set — a very common arrangement for people who need a
# proxy at all — then gets a direct connection that times out. Since every sync
# and every update check goes through this client, that turns "GitHub is
# reachable" into "this tool does not work", with an error that blames the
# network.
ureq = { version = "3", features = ["socks-proxy"] }

# misc
unicode-width = "0.2"
